[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-rat-race-api"
version = "0.1.0"
description = "FastAPI backend for the NYC Rat Race project"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]
data = [
    "duckdb>=1.0,<2.0",
    "numpy>=1.24,<3.0",
    "onnxruntime>=1.17,<2.0",
]
llm = [
    "google-genai>=2.0,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
